services:
  postgres:
    image: postgres:15-alpine
    container_name: alt_credit_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: alt_credit_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      # This stack runs against the Postgres service, not the SQLite default.
      USE_SQLITE: "false"
      # The app self-seeds on startup (lifespan); keep the legacy entrypoint
      # seed/train path off to avoid duplicate seeding.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      AUTO_SEED_ON_STARTUP: ${AUTO_SEED_ON_STARTUP:-false}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
