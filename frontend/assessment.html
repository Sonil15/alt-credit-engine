<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Alt-Credit — Psychometric Assessment</title>
  <style>
    /* Self-hosted Indic fonts so Bengali/Hindi render even when the device
       lacks them (otherwise Bengali shows as blank boxes — only ASCII survives). */
    @font-face {
      font-family: 'Noto Sans Bengali'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('/static/fonts/noto-bengali-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Noto Sans Bengali'; font-style: normal; font-weight: 600; font-display: swap;
      src: url('/static/fonts/noto-bengali-600.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Noto Sans Devanagari'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('/static/fonts/noto-devanagari-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Noto Sans Devanagari'; font-style: normal; font-weight: 600; font-display: swap;
      src: url('/static/fonts/noto-devanagari-600.woff2') format('woff2');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", "Noto Sans Devanagari", sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
      display: flex; justify-content: center; padding: 16px;
    }
    .phone {
      width: 100%; max-width: 420px; background: #1e293b; border-radius: 24px;
      overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 90vh;
    }
    .header { padding: 16px 20px; border-bottom: 1px solid #334155; }
    .header h1 { font-size: 18px; color: #f8fafc; }
    .header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .lang-bar { display: flex; gap: 8px; margin-top: 10px; }
    .lang-btn {
      flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: #94a3b8; cursor: pointer; font-size: 12px;
    }
    .lang-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    .lang-btn:disabled { opacity: 0.45; cursor: default; }
    .lang-btn.active:disabled { opacity: 1; }
    .start-bar { padding: 14px 16px; border-top: 1px solid #334155; }
    .start-btn {
      width: 100%; height: 48px; border-radius: 12px; border: none;
      background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .start-btn:hover { background: #1d4ed8; }
    .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .bubble {
      max-width: 85%; padding: 12px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45;
    }
    .bubble.agent { background: #0f172a; align-self: flex-start; border-bottom-left-radius: 4px; }
    .bubble.user { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 4px; }
    .options { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .opt-btn {
      padding: 10px 12px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #e2e8f0; cursor: pointer; text-align: left; font-size: 13px;
    }
    .opt-btn:hover { border-color: #3b82f6; }
    .input-bar {
      padding: 12px 16px; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center;
    }
    .input-bar input {
      flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #334155;
      background: #0f172a; color: #f1f5f9; font-size: 14px;
    }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      background: #334155; color: white; font-size: 18px;
    }
    .icon-btn.primary { background: #2563eb; }
    .icon-btn.recording { background: #dc2626; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }
    .progress { font-size: 11px; color: #64748b; padding: 0 16px 8px; }
    .result-panel { padding: 24px; text-align: center; }
    .score { font-size: 42px; font-weight: 800; color: #22c55e; margin: 12px 0; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .badge-APPROVE { background: #14532d; color: #86efac; }
    .badge-REVIEW { background: #713f12; color: #fde68a; }
    .badge-REJECT { background: #7f1d1d; color: #fca5a5; }
    .hidden { display: none !important; }
    .processing-panel { padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .processing-spinner {
      width: 52px; height: 52px; border-radius: 50%;
      border: 4px solid #334155; border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .processing-title { font-size: 16px; font-weight: 600; color: #f1f5f9; text-align: center; }
    .processing-steps { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .step-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #94a3b8; }
    .step-row.done { color: #22c55e; }
    .step-row.active { color: #e2e8f0; }
    .step-icon { font-size: 16px; width: 20px; text-align: center; }
    .processing-eta { font-size: 12px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <h1>Psychometric Assessment</h1>
      <p>RBI AA Consent · Trait-based · Agent-guided</p>
      <div class="lang-bar" id="lang-bar">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="hi">हिन्दी</button>
        <button class="lang-btn" data-lang="bn">বাংলা</button>
      </div>
    </div>
    <div class="progress" id="progress">Starting...</div>
    <div class="chat" id="chat"></div>
    <div id="processing-panel" class="processing-panel hidden">
      <div class="processing-spinner"></div>
      <div class="processing-title" id="processing-title">Analysing your responses…</div>
      <div class="processing-steps" id="processing-steps"></div>
      <div class="processing-eta" id="processing-eta">This usually takes 10–20 seconds</div>
    </div>
    <div id="result-panel" class="result-panel hidden">
      <p style="color:#94a3b8;font-size:14px;">Your Alternate Credit Score</p>
      <div class="score" id="score-display">—</div>
      <div class="badge badge-REVIEW" id="decision-badge">—</div>
      <p style="color:#94a3b8;font-size:13px;margin-top:12px;" id="pd-display"></p>
      <button class="icon-btn primary" style="width:100%;border-radius:12px;margin-top:16px;height:48px;"
        onclick="window.location='/dashboard?user_id=' + userId">View Bank Dashboard</button>
    </div>
    <div class="start-bar" id="start-bar">
      <button class="start-btn" id="start-btn">Start Assessment</button>
    </div>
    <div class="input-bar hidden" id="input-bar">
      <button class="icon-btn" id="mic-btn" title="Speak answer">🎤</button>
      <input type="text" id="answer-input" placeholder="Type your answer...">
      <button class="icon-btn primary" id="send-btn">➤</button>
    </div>
  </div>

  <script src="/static/voice.js?v=2"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let userId = params.get('user_id') || crypto.randomUUID();
    let language = params.get('lang') || 'en';
    let sessionId = null;
    let started = false;
    let currentItem = null;
    let voice = VoiceProvider.createVoiceProvider();
    const chat = document.getElementById('chat');
    const input = document.getElementById('answer-input');
    const micBtn = document.getElementById('mic-btn');

    const START_LABEL = { en: 'Start Assessment', hi: 'मूल्यांकन शुरू करें', bn: 'মূল্যায়ন শুরু করুন' };
    const PROCESSING_TITLE = {
      en: 'Analysing your responses…',
      hi: 'आपके उत्तरों का विश्लेषण हो रहा है…',
      bn: 'আপনার উত্তর বিশ্লেষণ করা হচ্ছে…',
    };
    const PROCESSING_STEPS = {
      en: ['Scoring trait responses', 'Running credit model', 'Computing risk profile', 'Preparing your report'],
      hi: ['व्यवहार स्कोर कर रहे हैं', 'क्रेडिट मॉडल चला रहे हैं', 'जोखिम प्रोफ़ाइल तैयार कर रहे हैं', 'रिपोर्ट तैयार हो रही है'],
      bn: ['আচরণের স্কোর করা হচ্ছে', 'ক্রেডিট মডেল চালানো হচ্ছে', 'ঝুঁকির প্রোফাইল তৈরি হচ্ছে', 'রিপোর্ট প্রস্তুত হচ্ছে'],
    };

    function showProcessingPanel() {
      document.getElementById('chat').classList.add('hidden');
      document.getElementById('processing-panel').classList.remove('hidden');
      document.getElementById('processing-title').textContent = PROCESSING_TITLE[language] || PROCESSING_TITLE.en;
      const steps = PROCESSING_STEPS[language] || PROCESSING_STEPS.en;
      const container = document.getElementById('processing-steps');
      container.innerHTML = '';
      steps.forEach((label, i) => {
        const row = document.createElement('div');
        row.className = 'step-row';
        row.id = 'step-' + i;
        row.innerHTML = `<span class="step-icon">○</span><span>${label}</span>`;
        container.appendChild(row);
      });
      // Animate steps sequentially
      steps.forEach((_, i) => {
        setTimeout(() => {
          if (i > 0) {
            const prev = document.getElementById('step-' + (i - 1));
            if (prev) { prev.classList.add('done'); prev.querySelector('.step-icon').textContent = '✓'; }
          }
          const cur = document.getElementById('step-' + i);
          if (cur) { cur.classList.add('active'); cur.querySelector('.step-icon').textContent = '→'; }
        }, i * 700);
      });
      setTimeout(() => {
        const last = document.getElementById('step-' + (steps.length - 1));
        if (last) { last.classList.add('done'); last.querySelector('.step-icon').textContent = '✓'; }
      }, steps.length * 700);
    }
    const INTRO = {
      en: 'Choose your language above, then tap the button below to begin.',
      hi: 'ऊपर अपनी भाषा चुनें, फिर शुरू करने के लिए नीचे दिए बटन पर टैप करें।',
      bn: 'উপরে আপনার ভাষা বেছে নিন, তারপর শুরু করতে নিচের বোতামে ট্যাপ করুন।',
    };

    function refreshLangUI() {
      document.querySelectorAll('.lang-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.lang === language));
      document.getElementById('start-btn').textContent = START_LABEL[language] || START_LABEL.en;
      const intro = document.getElementById('intro-bubble');
      if (intro) intro.textContent = INTRO[language] || INTRO.en;
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.onclick = () => {
        if (started) return;
        language = btn.dataset.lang;
        refreshLangUI();
        // Hide all other language buttons once a choice is made
        document.querySelectorAll('.lang-btn').forEach(b => {
          b.style.display = b.dataset.lang === language ? '' : 'none';
        });
      };
    });

    function beginAssessment() {
      if (started) return;
      started = true;
      document.querySelectorAll('.lang-btn').forEach(b => { b.disabled = true; });
      document.getElementById('start-bar').classList.add('hidden');
      document.getElementById('input-bar').classList.remove('hidden');
      chat.innerHTML = '';            // clear the pre-start intro bubble
      startSession();
    }

    function addBubble(text, role) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderOptions(item) {
      if (!item.options || !item.options.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'options';
      item.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt.value + '. ' + opt.label;
        btn.onclick = () => submitAnswer(String(opt.value));
        wrap.appendChild(btn);
      });
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    async function startSession() {
      const resp = await fetch('/assessment/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, language }),
      });
      const data = await resp.json();
      sessionId = data.session_id;
      userId = data.user_id;
      addBubble(data.message, 'agent');
      if (voice.synth) await voice.speak(data.message, language);
      handleItem(data.item);
      document.getElementById('progress').textContent = `Progress: ${Math.round(data.progress * 100)}%`;
    }

    function handleItem(item) {
      if (!item) return;
      currentItem = item;
      addBubble(item.prompt + (item.hint ? '\n\n' + item.hint : ''), 'agent');
      if (voice.synth) voice.speak(item.prompt, language);
      renderOptions(item);
    }

    async function submitAnswer(answer) {
      if (!sessionId || !currentItem || !answer.trim()) return;
      addBubble(answer.trim(), 'user');
      input.value = '';

      const resp = await fetch('/assessment/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, item_id: currentItem.item_id, answer: answer.trim() }),
      });
      const data = await resp.json();
      document.getElementById('progress').textContent = `Progress: ${Math.round(data.progress * 100)}%`;

      if (data.needs_clarification) {
        addBubble(data.message, 'agent');
        if (voice.synth) voice.speak(data.message, language);
        handleItem(data.item);
        return;
      }

      if (data.completed) {
        addBubble(data.message, 'agent');
        document.getElementById('input-bar').classList.add('hidden');
        await finishAndScore();
        return;
      }

      if (data.message) addBubble(data.message, 'agent');
      handleItem(data.item);
    }

    async function finishAndScore() {
      showProcessingPanel();
      await new Promise(r => setTimeout(r, 3500));
      try {
        const resp = await fetch('/score/' + userId);
        if (!resp.ok) throw new Error('Score pending');
        const score = await resp.json();
        document.getElementById('processing-panel').classList.add('hidden');
        document.getElementById('result-panel').classList.remove('hidden');
        document.getElementById('score-display').textContent = score.credit_score;
        const badge = document.getElementById('decision-badge');
        badge.textContent = score.decision;
        badge.className = 'badge badge-' + score.decision;
        document.getElementById('pd-display').textContent =
          'PD: ' + (score.probability_of_default * 100).toFixed(1) + '% · ' + (score.reason_codes_text || '');
      } catch (_) {
        document.getElementById('processing-panel').classList.add('hidden');
        document.getElementById('result-panel').classList.remove('hidden');
        document.getElementById('score-display').textContent = 'Submitted';
        document.getElementById('decision-badge').textContent = 'PROCESSING';
        document.getElementById('pd-display').textContent = 'Assessment saved. Score available after model training.';
      }
    }

    document.getElementById('send-btn').onclick = () => submitAnswer(input.value);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submitAnswer(input.value); });

    micBtn.onclick = async () => {
      if (!voice.recognition) {
        addBubble('Voice not supported — please type your answer.', 'agent');
        return;
      }
      micBtn.classList.add('recording');
      try {
        const transcript = await voice.listen(language);
        input.value = transcript;
        await submitAnswer(transcript);
      } catch (err) {
        addBubble('Could not capture voice: ' + err.message, 'agent');
      } finally {
        micBtn.classList.remove('recording');
      }
    };

    // No auto-start: let the borrower pick a language first, then tap Start.
    document.getElementById('progress').textContent = '';
    const introBubble = document.createElement('div');
    introBubble.className = 'bubble agent';
    introBubble.id = 'intro-bubble';
    chat.appendChild(introBubble);
    document.getElementById('start-btn').onclick = beginAssessment;
    refreshLangUI();
  </script>
</body>
</html>
